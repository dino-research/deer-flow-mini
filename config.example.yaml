# DeerFlow Mini — Configuration
# Copy to config.yaml and customize for your environment.

config_version: 9
log_level: info

# ── Token Usage ──────────────────────────────────────────────────────────────
token_usage:
  enabled: false

# ── Models ───────────────────────────────────────────────────────────────────
# Configure your LLM. Use any OpenAI-compatible endpoint (vLLM, Ollama, LiteLLM).
models:
  # Example: vLLM with Gemma 4 E4B (recommended for deer-flow-mini)
  # - name: gemma-4-e4b
  #   display_name: Gemma 4 E4B (vLLM)
  #   use: langchain_openai:ChatOpenAI
  #   model: google/gemma-4-e4b
  #   api_key: $OPENAI_API_KEY
  #   base_url: http://localhost:8000/v1
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 4096

  # Example: Ollama
  # - name: gemma4-local
  #   display_name: Gemma 4 27B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: gemma4:27b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   temperature: 0.7
  #   supports_thinking: true
  #   supports_vision: true

# ── Tool Groups ──────────────────────────────────────────────────────────────
tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

# ── Tools ────────────────────────────────────────────────────────────────────
tools:
  # SearXNG web search (local, no API key)
  - name: web_search
    group: web
    use: deerflow.community.searxng.tools:web_search_tool
    max_results: 5

  # Local web fetch (httpx + readabilipy)
  - name: web_fetch
    group: web
    use: deerflow.community.local_fetch.tools:web_fetch_tool

  # File operations
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200

  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

# ── Loop Detection ───────────────────────────────────────────────────────────
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50

# ── Uploads ──────────────────────────────────────────────────────────────────
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto

# ── Sandbox ──────────────────────────────────────────────────────────────────
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  # Tuned for 32K context model
  bash_output_max_chars: 8000
  read_file_output_max_chars: 16000
  ls_output_max_chars: 8000

# ── Skills ───────────────────────────────────────────────────────────────────
skills:
  container_path: /mnt/skills

# ── Title ────────────────────────────────────────────────────────────────────
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

# ── Summarization (tuned for 32K context) ────────────────────────────────────
summarization:
  enabled: true
  model_name: null
  trigger:
    - type: tokens
      value: 8000
  keep:
    type: messages
    value: 6
  trim_tokens_to_summarize: 8000
  summary_prompt: null
  preserve_recent_skill_count: 3
  preserve_recent_skill_tokens: 12000
  preserve_recent_skill_tokens_per_skill: 4000
  skill_file_read_tool_names:
    - read_file

# ── Memory ───────────────────────────────────────────────────────────────────
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 30
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 500

# ── Database ─────────────────────────────────────────────────────────────────
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data

# ── Run Events ───────────────────────────────────────────────────────────────
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true

# ── Skill Evolution (disabled) ───────────────────────────────────────────────
skill_evolution:
  enabled: false
