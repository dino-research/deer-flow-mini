# SearXNG settings for DeerFlow Mini
# Minimal config — only JSON API needed for agent search

use_default_settings: true

server:
  secret_key: "deer-flow-mini-searxng-secret"
  bind_address: "0.0.0.0"
  port: 8080

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
  - name: bing
    engine: bing
    shortcut: bi
